name: Pinnacle Drops Telegram Scanner

on:
  schedule:
    # Запускается автоматически каждые 10 минут в облаке GitHub (даже когда ваш ПК выключен)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Позволяет запускать вручную одной кнопкой "Run workflow" во вкладке Actions

jobs:
  scan-pinnacle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: 🐍 Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🌐 Установка Google Chrome (Headless)
        uses: browser-actions/setup-chrome@v1

      - name: 💾 Восстановление и сохранение истории сигналов (sent_keys.json)
        uses: actions/cache@v4
        with:
          path: sent_keys.json
          key: pinnacle-sent-keys-v1 # Стабильный ключ, не зависящий от run_id

      - name: 📦 Установка библиотек (selenium, requests, webdriver-manager)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Запуск сканера ScanBet Pinnacle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SINGLE_RUN: "true"
        run: python scraper.py
