name: Pinnacle Drops Telegram Scanner

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scan-pinnacle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Скачивание кода репозитория
        uses: actions/checkout@v6

      - name: 🐍 Установка Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🌐 Установка Google Chrome и ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'

      - name: 💾 Восстановление и сохранение истории сигналов
        uses: actions/cache@v5
        with:
          path: sent_keys.json
          key: pinnacle-sent-keys-v1
          restore-keys: |
            pinnacle-sent-keys-

      - name: 📦 Установка библиотек Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Запуск сканера ScanBet Pinnacle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SINGLE_RUN: "true"
        run: python scraper.py
